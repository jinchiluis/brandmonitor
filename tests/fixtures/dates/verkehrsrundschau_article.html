        "headline": "Zukunftskongress Logistik: Resilienz st\u00e4rken in unsicheren Zeiten",
        "mainEntityOfPage": "https://www.verkehrsrundschau.de/nachrichten/transport-logistik/zukunftskongress-logistik-resilienz-staerken-in-unsicheren-zeiten-3901524",
        "abstract": "Beim Zukunftskongress Logistik 2026 standen neben KI und Robotik auch die Themen Resilienz, Cybersicherheit und Defence im Fokus. Branchenexperten diskutierten in Dortmund Herausforderungen und Chancen.",
        "description": "Beim Zukunftskongress Logistik 2026 standen neben KI und Robotik auch die Themen Resilienz, Cybersicherheit und Defence im Fokus. Branchenexperten diskutierten in Dortmund Herausforderungen und Chancen.",
        "articleBody": " Vom russischen Angriffskrieg in der Ukraine samt hybrider Angriffe auf Europa und Deutschland, \u00fcber den Krieg zwischen den USA und Iran und die Probleme an der Stra\u00dfe von Hormus bis hin zu den immer bedrohlicher wirkenden Spannungen im China\/Taiwan-Konflikt \u2013 die geopolitische Lage zieht auch die Lieferketten und damit die Logistik in Mitleidenschaft. Das Motto des diesj\u00e4hrigen Zukunftskongress Logistik \u2013 44. Dortmunder Gespr\u00e4che am 8. und 9. September lautete denn auch: \u201eSichere Logistik f\u00fcr unsichere Zeiten\u201c. Selbstverst\u00e4ndlich fanden sich in dem vom Fraunhofer IML zusammengestellten Programm auch in diesem Jahr wieder ausf\u00fchrlich Trendthemen wie KI-basierte Robotik oder Space Logistics wieder. Am ersten Kongresstag bildeten aber vor allem Sicherheit und Resilienz sowie der in der Logistikbranche derzeit als neues Bet\u00e4tigungsfeld gehandelte Defence-Bereich die thematische Klammer. Geopolitische Krisen belasten Lieferketten  Nachdem Dr. Heiko Herold als Vertreter des Instituts f\u00fcr Sicherheitspolitik an der Universit\u00e4t Kiel in seiner Keynote \u201eDer globale Systemkonflikt um die Weltordnung des 21. Jahrhunderts\u201c die aktuellen und drohenden geopolitischen Konflikte aus seiner Sicht einordnete, kamen in anschlie\u00dfenden Paneldiskussionen Praktiker aus der Logistikbranche zu Wort. So diskutierten Duisport-CEO Markus Bangen, Andre Kranke, Head of Corporate Research & Development bei Dachser, Markus Sandbrink, CIO Rhenus Group und Petra Schl\u00f6r, Chief Information Security Officer bei SSI Sch\u00e4fer in der von Anja Seemann moderierten Runde zum Thema Sicherheit. Und die hat viele Facetten. Mehr Befugnisse bei der Drohnenabwehr gefordert  Die Ballung sehr vieler verschiedener Ebenen, in der die Logistik Resilienz beweisen m\u00fcsse, sei jedenfalls neu, sagte Markus Bangen von Duisport. Dazu geh\u00f6rten der Schutz gegen Cyberangriffe und Sabotageakte gegen die physische Infrastruktur ebenso wie die gest\u00f6rten Lieferketten infolge geopolitischer Konflikte und nicht zuletzt die Niedrigwasserkrise. Er verwies als Hafenchef auf die Besonderheiten, die ein Binnenhafen mit sich bringt: \u201eDie physische Infrastruktur liegt mitten in der Stadt. Wir k\u00f6nnen nicht wie ein Flughafen einfach einen Zaun herumziehen.\u201c Es gebe zwar mit den Beh\u00f6rden abgestimmte Hafensicherheitspl\u00e4ne. Vor allem, was den Schutz der physischen Infrastruktur angeht \u2013 etwa bei der Drohnenabwehr - sieht Bangen aber viel Handlungsbedarf. \u201eDamit setzen wir uns seit Jahren auseinander. Wir haben kein Erkenntnisproblem, wo die Bedrohungen liegen\u201c, so der Duisport-Chef. Bei Themen wie Regulatorik, Gesetzeslage und vor allem Befugnissen seien wir aber \u201eteilweise auf dem Stand von 1984\u201c, klagt Bangen. Was man momentan mache k\u00f6nne sei, selbst Drohnen zur \u00dcberwachung zu nutzen, auch Unterwasserdrohnen. Er appellierte an die Politik, in Sachen Drohnenabwehr schnell t\u00e4tig zu werden. \"Wenn aus den Ank\u00fcndigungen ein abgestimmtes Vorgehen der Bundesregierung wird, kenne ich niemanden bei uns im Hafen, der nicht bereit ist, sofort aktiv zu werden\", betonte Bangen. Der Hafen kommuniziere seit Jahren, was er brauche. \"Was wir nicht brauchen ist, dass die Bundes- und Landespolizei im Duisburger Hafen eine Drohnenabwehreinheit stationiert. Das k\u00f6nnen wir schon selber.\u201c Cyberangriffe auf Logistiker nehmen zu  W\u00e4hrend das Thema physische Sabotage von kritischer Infrastruktur zuletzt massiv an Bedeutung gewonnen hat, ist gerade f\u00fcr Logistiker die Bedrohung durch Cyberangriffe nicht kleiner geworden, ganz im Gegenteil. \u201eWir sind als Logistiker immer st\u00e4rkeren Bedrohungen ausgesetzt. Wir werden jeden Tag angegriffen und m\u00fcssen sehr viel daf\u00fcr tun, um die Systeme davor zu sch\u00fctzen\u201c, sagte Markus Sandbrink von Rhenus. Dazu geh\u00f6rten organisatorische Ma\u00dfnahmen und Zertifizierungen, aber auch der Einsatz von KI-Tools zur Identifizierung von Angriffen. Vor allem sei da aber der Mensch, laut Sandbrink \u201eSchwachstelle Nummer eins\u201c, den man st\u00e4ndig auf die Gefahren sensibilisieren m\u00fcsse. Rhenus f\u00fchre daher regelm\u00e4\u00dfig Phishingtests und Schulungen durch. Andre Kranke von Dachser sieht die konsequente Fokussierung auf ein starkes Netzwerk als Basis f\u00fcr eine resiliente Logistik: So k\u00f6nne man verkraften, wenn f\u00fcr eine gewisse Zeit ein Standort ausfalle - das gro\u00dfe Netzwerk mit zahlreichen Standorten k\u00f6nnten dies auffangen. OT-Systeme als Schwachstelle der Intralogistik  In der Intralogistik liege der Schwachpunkt oft in der OT-Welt (Operational Technology). Dies betonte Petra Schl\u00f6r, als Chief Information Security Officer beim Intralogistik-Anlagenbauer SSI Sch\u00e4fer Expertin sowohl f\u00fcr IT als auch OT. \u201eEin Hacker muss gar nicht st\u00e4ndig neue IT-Security-L\u00fccken suchen, er kann sich in lang vernachl\u00e4ssigten Produktionsumgebungen einfach an vorhandenen Schwachstellen bedienen\u201c, warnt Schl\u00f6r. Viele Systeme seien vor 15 Jahren oder l\u00e4nger implementiert worden, \u201enat\u00fcrlich auf Grundlage einer ganz anderen Bedrohungslage\u201c. Historisch gewachsene Infrastrukturen mit vielen verschiedenen Herstellern und Technologien, die m\u00f6glicherweise nicht harmonisiert und standardisiert sind - die IT- und OT-Infrastruktur in Summe sei f\u00fcr Hacker \u201eein offenes Scheunentor\u201c, warnte Schl\u00f6r. \u201eInsofern ist das gr\u00f6\u00dfte Risiko aktuell aus meiner Sicht tats\u00e4chlich die mangelnde Widerstandsf\u00e4higkeit aufgrund der Komplexit\u00e4t, die wir managen m\u00fcssen.\u201c Und wie bekommt man das hin? Sicherheit als Basis f\u00fcr stabilen Durchsatz  Ein ISO-Zertifikat an der Wand allein sch\u00fctze keine Logistikanlage vor einem Cyberangriff, konstatiert Schl\u00f6r. \u201eSicherheitsma\u00dfnahmen funktionieren nur gemeinsam \u2013 mit der Betriebsumgebung, den Zugriffskonzepten und den Prozessen des Kunden.\u201c Bei aller Komplexit\u00e4t dieser Aufgaben h\u00e4lt sie \u00fcbrigens die Annahme, dass Sicherheit auf Kosten des Durchsatzes gehe, f\u00fcr einen Trugschluss: \u201eIch sehe Sicherheit tats\u00e4chlich als eine Grundvoraussetzung, um langfristig einen stabilen Durchsatz zu erhalten\u201c, so Schl\u00f6r. Bei einem Stillstand, etwa aufgrund eines Cyberangriffs, sei der Durchsatz schlie\u00dflich gleich null und k\u00f6nne Unternehmen m\u00f6glicherweise die Existenz kosten. Defence-Logistik r\u00fcckt in den Fokus  Ein weiteres Thema, das auf dem diesj\u00e4hrigen Zukunftskongress eine gewichtige Rolle spielte, war Defence - einer der auf einer weiteren Paneldiskussion er\u00f6rterten \u201eNeuen M\u00e4rkte f\u00fcr die Logistik\u201c. Auf dem Podium: Michael Quaden, Program Director Defence Solutions beim Kontraktlogistiker Fiege, Sascha H\u00e4hnke, Gesch\u00e4ftsf\u00fchrer beim Entsorger Remondis und Theresa Gr\u00f6ninger, Head of Sales & Marketing beim F\u00f6rdertechnikanbieter Cellumation. Die Beteiligen waren sich einig, dass das Feld Verteidigungslogistik eigentlich nicht neu sei, sondern dass sich die Vorzeichen entscheidend ge\u00e4ndert h\u00e4tten. Es gehe nicht nur um Einlagerung und Bereitstellung von milit\u00e4rischen G\u00fctern, \u201evon der Unterhose bis hin zum Flugzeug\u201c, wie es Quaden salopp formulierte. \u201eDie gro\u00dfe Herausforderung ist, dass wir uns in einer geopolitischen Lage bewegen, in der NATO und Bundeswehr ganz deutlich sagen: Wir sind personell und materiell nicht dazu in der Lage, die gesamte Supply Chain abzudecken.\u201c Hier komme es nicht nur f\u00fcr die Kontaktlogistik, sondern f\u00fcr die gesamte Logistik darauf an, \u201esich in diesem Konzert einzureihen und darauf einzustellen, diesen Herausforderungen auch gerecht zu werden\u201c, so Quaden. Infrastruktur als Achillesferse der Verteidigungslogistik  Theresa Gr\u00f6ninger, die f\u00fcr die CDU auch als Abgeordnete in der Bremischen B\u00fcrgerschaft sitzt, macht sich vor allem \u00fcber die grundlegende Voraussetzung f\u00fcr eine funktionierende Defence-Logistik Sorgen: Der Zustand von Br\u00fccken und Stra\u00dfen ist bekannterma\u00dfen schlecht, der Schutz der kritischen Infrastruktur anf\u00e4llig. \u201eWenn ich \u00fcber Verteidigungslogistik spreche, muss ich mir angucken, wie sieht die Infrastruktur aus?\u201c Bremerhaven sei schlie\u00dflich \u201edas Einfallstor der gesamten NATO-M\u00e4chte nach Europa\u201c, so Gr\u00f6ninger. Milliardenmarkt Defence: Geduld gefragt  In einem war man sich auf dem Podium schnell einig: Einfach werde es f\u00fcr Logistiker nicht, im Defence-Bereich mitzumischen. \u201eDie Frage ist: Bin ich bereit, den steinigen und etwas holprigen Weg mit der Bundeswehr, dem THW und allen Beh\u00f6rden, die damit einhergehen, zu beschreiten?\u201c, so Quaden. Apropos steinig und holprig - Fieges Defence-Logistik-Experte machte auch unmissverst\u00e4ndlich deutlich: \u201eWenn wir \u00fcber ein Sonderverm\u00f6gen von 500 Milliarden sprechen, dann glauben Sie bitte nicht, dass Sie innerhalb von ein, zwei Monaten Milliardenauftr\u00e4ge bekommen.\u201c Man rede hier \u00fcber viele Jahre. Digital Logistic Awards verliehen  Traditionell wird im Rahmen des Zukunftskongress Logistik der Digital Logistics Award an Start-ups verliehen. \u00dcber 30 Start-ups aus sechs L\u00e4ndern hatten sich in diesem Jahr beworben. Sieben Finalisten stellten in einem Elevator Pitch ihre L\u00f6sungen vor, anschlie\u00dfend stimmten Publikum und Jury f\u00fcr ihre Favoriten ab. Das sind die Sieger 2026: Platz 1: Cargovibe aus Dortmund f\u00fcr ihren \u201edigitalen Beifahrer\u201c f\u00fcr den Logistikbetrieb (Preisgeld: 6000 Euro) Platz 2: SLAPstack aus Dortmund f\u00fcr KI-gest\u00fctzte L\u00f6sungen f\u00fcr die Lagerintelligenz (Preisgeld: 3000 Euro) Platz 3: Hadros aus der Schweiz f\u00fcr eine Full-Stack-Robotikplattform, bei der autonome Kommissionierroboter mit taktilen Greifern ausgestattet sind (Preisgeld: 1000 Euro) Die Preisgelder wurden vom Dortmund Hafen 21, BITO Campus und der Dortmunder Wirtschaftskanzlei Audalis zur Verf\u00fcgung gestellt. ",
